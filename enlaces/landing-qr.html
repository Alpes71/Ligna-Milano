<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ligna Milano</title>
<meta name="description" content="Diseño que deja huella. Web, dosier, WhatsApp, Instagram y TikTok de Ligna Milano.">
<meta name="theme-color" content="#100D0B">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --fondo:    #100D0B;
    --superficie:#1A1512;
    --cobre:    #C97A4A;
    --cobre-luz:#DB895B;
    --marfil:   #F0E2D4;
    --negro:    #000000;
    --radio: 12px;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}

  body{
    background:var(--fondo);
    color:var(--marfil);
    font-family:"Lato",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100svh;
    padding:calc(env(safe-area-inset-top) + 24px) 22px calc(env(safe-area-inset-bottom) + 26px);
    overflow-x:hidden;
  }

  /* Halo cálido detrás del medallón */
  body::before{
    content:"";
    position:fixed;
    top:26%;
    left:50%;
    width:min(140vw,700px);
    height:min(140vw,700px);
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(201,122,74,.16) 0%, rgba(201,122,74,.05) 42%, transparent 68%);
    pointer-events:none;
  }

  .lienzo{
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    flex:1;
    position:relative;
  }

  /* ---------- Medallón ---------- */
  .medallon{
    margin:auto 0;
    padding:14px 0 34px;
    display:flex;
    justify-content:center;
    position:relative;
  }

  .disco{
    position:relative;
    width:min(76vw,300px);
    aspect-ratio:1101 / 1123;
    filter:drop-shadow(0 18px 40px rgba(0,0,0,.65));
    opacity:0;
    animation:aparecer 700ms ease-out 120ms forwards;
  }

  .disco img{
    width:100%;
    height:100%;
    display:block;
  }

  /* Barniz selectivo: luz rasante que cruza el disco una vez */
  .disco::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    background:linear-gradient(104deg,
      transparent 34%,
      rgba(219,137,91,.30) 47%,
      rgba(255,236,220,.42) 51%,
      rgba(219,137,91,.30) 55%,
      transparent 68%);
    mix-blend-mode:screen;
    opacity:0;
    animation:barniz 1500ms cubic-bezier(.35,0,.2,1) 620ms forwards;
    pointer-events:none;
  }

  @keyframes barniz{
    0%   {opacity:0; transform:translateX(-58%)}
    18%  {opacity:1}
    82%  {opacity:1}
    100% {opacity:0; transform:translateX(58%)}
  }

  @keyframes aparecer{
    from{opacity:0; transform:scale(.94)}
    to  {opacity:1; transform:none}
  }

  /* ---------- Enlaces ---------- */
  nav{
    display:flex;
    flex-direction:column;
    gap:11px;
  }

  .rotulo{
    font-family:"Cinzel",serif;
    font-size:11px;
    letter-spacing:.22em;
    text-transform:uppercase;
    text-align:center;
    color:color-mix(in srgb, var(--marfil) 42%, transparent);
    margin-bottom:9px;
  }

  .placa{
    position:relative;
    display:flex;
    align-items:center;
    gap:15px;
    padding:16px 18px;
    min-height:66px;
    border-radius:var(--radio);
    background:var(--superficie);
    border:1px solid color-mix(in srgb, var(--cobre) 34%, transparent);
    color:inherit;
    text-decoration:none;
    overflow:hidden;
    opacity:0;
    transform:translateY(10px);
    animation:subir 520ms ease-out forwards;
    transition:transform 130ms ease, border-color 200ms ease, background 200ms ease;
  }
  .placa:nth-of-type(1){animation-delay:900ms}
  .placa:nth-of-type(2){animation-delay:990ms}
  .placa:nth-of-type(3){animation-delay:1080ms}
  .placa:nth-of-type(4){animation-delay:1170ms}
  .placa:nth-of-type(5){animation-delay:1260ms}

  @keyframes subir{to{opacity:1; transform:none}}

  .placa::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(100deg, transparent 32%, rgba(219,137,91,.16) 50%, transparent 68%);
    opacity:0;
    transition:opacity 200ms ease;
  }
  .placa:hover,.placa:active{
    border-color:var(--cobre-luz);
    background:#211A15;
  }
  .placa:hover::after,.placa:active::after{opacity:1}
  .placa:active{transform:scale(.986)}
  .placa:focus-visible{outline:2px solid var(--cobre-luz); outline-offset:3px}

  .icono{
    flex:0 0 21px;
    width:21px;height:21px;
    fill:none;
    stroke:var(--cobre-luz);
    stroke-width:1.5;
    stroke-linecap:round;
    stroke-linejoin:round;
  }

  .texto{flex:1;min-width:0}

  .destino{
    display:block;
    font-family:"Cinzel",serif;
    font-weight:600;
    font-size:15px;
    letter-spacing:.09em;
    text-transform:uppercase;
  }
  .detalle{
    display:block;
    font-size:12px;
    margin-top:3px;
    color:color-mix(in srgb, var(--marfil) 48%, transparent);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .flecha{
    flex:0 0 auto;
    width:15px;height:15px;
    fill:none;
    stroke:color-mix(in srgb, var(--marfil) 38%, transparent);
    stroke-width:1.7;
    stroke-linecap:round;
    stroke-linejoin:round;
  }

  footer{
    margin-top:24px;
    text-align:center;
    font-size:10px;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:color-mix(in srgb, var(--marfil) 26%, transparent);
    opacity:0;
    animation:subir 520ms ease-out 1350ms forwards;
  }

  @media (max-height:640px){
    .disco{width:min(58vw,220px)}
    .medallon{padding:6px 0 22px}
  }

  @media (prefers-reduced-motion:reduce){
    .disco,.placa,footer{opacity:1; transform:none; animation:none}
    .disco::after{display:none}
  }
</style>
</head>
