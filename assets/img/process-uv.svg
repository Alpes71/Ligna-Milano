    <linearGradient id="uvPanel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1d1a16"/><stop offset="1" stop-color="#100e0c"/></linearGradient>
    <filter id="uvGlow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
